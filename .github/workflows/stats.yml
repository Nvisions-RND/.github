name: Profile stats

# 조직 프로필 README 의 통계(저장소별 커밋 현황·잔디·3D 잔디)를 매일 새로 만든다 — scripts/build-stats.mjs.
# 비공개 저장소까지 읽으려면 저장소 비밀 ORG_TOKEN(조직 저장소 읽기 권한의 PAT)이 있어야 한다. 없으면 공개 저장소만 센다.

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build stats and commit
        env:
          ORG_TOKEN: ${{ secrets.ORG_TOKEN }}
        run: |
          # 비밀이 없으면 GITHUB_TOKEN 으로 공개 저장소만 세어 README 를 줄여 버리므로 아예 건너뛴다
          if [ -z "$ORG_TOKEN" ]; then echo "::warning::ORG_TOKEN 비밀이 없어 통계를 갱신하지 않는다"; exit 0; fi
          node scripts/build-stats.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: 프로필 통계 갱신"
          git push
